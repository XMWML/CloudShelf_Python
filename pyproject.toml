[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudshelf"
version = "1.1.0"
description = "Cross-platform FTP, SFTP and WebDAV file manager"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}

[project.optional-dependencies]
desktop = ["keyring", "tkinterdnd2"]

[project.scripts]
cloudshelf = "cloudshelf:main"

[tool.setuptools]
py-modules = ["cloudshelf"]
packages = ["cloudshelf_core"]
